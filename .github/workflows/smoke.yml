name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  action-smoke:
    runs-on: ubuntu-latest
    env:
      RUNX_RECEIPT_SIGN_KID: runx-action-smoke
      RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      RUNX_RECEIPT_SIGN_ISSUER_TYPE: hosted
    steps:
      - uses: actions/checkout@v7

      - name: Create fixture skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runx-fixture/skills/echo"
          cat > "$RUNNER_TEMP/runx-fixture/skills/echo/SKILL.md" <<'EOF'
          ---
          name: echo
          description: Echo a message through the cli-tool adapter.
          ---

          Echo the provided message.
          EOF
          cat > "$RUNNER_TEMP/runx-fixture/skills/echo/X.yaml" <<'EOF'
          skill: echo
          version: "0.1.0"
          catalog:
            kind: skill
            audience: system
            visibility: internal
            role: canonical
          runners:
            default:
              default: true
              type: cli-tool
              command: /usr/bin/env
              args:
                - sh
                - ./run.sh
              inputs:
                message:
                  type: string
                  required: true
                  description: Message to echo
              outputs:
                message: string
          EOF
          cat > "$RUNNER_TEMP/runx-fixture/skills/echo/run.sh" <<'EOF'
          #!/bin/sh
          node -e 'process.stdout.write(JSON.stringify({message:process.env.RUNX_INPUT_MESSAGE ?? ""}))'
          EOF
          chmod +x "$RUNNER_TEMP/runx-fixture/skills/echo/run.sh"

      - name: Run local action
        id: runx
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/runx-fixture
          skill: ./skills/echo
          receipt-dir: ${{ runner.temp }}/runx-receipts
          args: |
            --message=hello from runx-action

      - name: Verify output and receipt
        shell: bash
        env:
          RUNX_ACTION_STDOUT: ${{ steps.runx.outputs.stdout }}
          RUNX_ACTION_EXIT_CODE: ${{ steps.runx.outputs.exit-code }}
        run: |
          set -euo pipefail
          receipt_id=$(node -e '
            const result = JSON.parse(process.env.RUNX_ACTION_STDOUT);
            if (process.env.RUNX_ACTION_EXIT_CODE !== "0" || result.status !== "sealed" || result.result?.message !== "hello from runx-action" || !/^sha256:[0-9a-f]{64}$/.test(result.receipt_id ?? "")) process.exit(1);
            process.stdout.write(result.receipt_id);
          ')
          runx verify "$receipt_id" --receipt-dir "$RUNNER_TEMP/runx-receipts" --json > "$RUNNER_TEMP/verified.json"
          node -e 'const v=require(process.argv[1]); if(v.valid!==true || v.trees?.[0]?.root_receipt_id!==process.argv[2]) process.exit(1)' "$RUNNER_TEMP/verified.json" "$receipt_id"

      - name: Run syntax check
        shell: bash
        run: bash -n scripts/runx-action.sh
